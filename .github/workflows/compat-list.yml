# Rebuilds COMPATIBILITY.md, COMPATIBILITY.ko.md and compat.json from the "3D compatibility report" issues
# (label: compat) whenever a report is opened, edited, closed, labelled or deleted.
# A deleted issue always triggers a rebuild (its event payload may carry no labels).
# Moderation: label a report invalid / duplicate / spam / wontfix, or close it as "not planned", to drop it from the list.
#
# Every list run rebuilds from all reports on the newest master, so when reports arrive in a burst GitHub may cancel
# the waiting runs in between (only one waits per concurrency group); the last run still covers every report.
# The thank-you comment is its own job outside that group, so it is never cancelled.
name: Compatibility list

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  list:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'compat') ||
      github.event.action == 'unlabeled' ||
      github.event.action == 'deleted'
    runs-on: ubuntu-latest
    concurrency:
      group: compat-list
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Build and commit the list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # always build on the newest branch head: the generated files are rebuilt, never merged
            git fetch -q origin "$branch" && git reset -q --hard "origin/$branch"
            python3 .github/scripts/compat_list.py --out .
            git add COMPATIBILITY.md COMPATIBILITY.ko.md compat.json
            if git diff --cached --quiet; then echo "list unchanged"; exit 0; fi
            git commit -q -m "Update compatibility list"
            if git push -q origin "HEAD:$branch"; then echo "list updated"; exit 0; fi
            echo "push rejected (branch moved), retrying"; sleep $((attempt * 3))
          done
          exit 1

  thank:
    if: github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'compat')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the report
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/compat_list.py --check "$ISSUE_NUMBER"

      - name: Thank the reporter
        if: steps.check.outputs.listed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ENGINE: ${{ steps.check.outputs.engine }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/blob/${{ github.event.repository.default_branch }}"
          gh issue comment "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --body "Thanks for the report! It goes into the [3D compatibility list]($base/COMPATIBILITY.md) under **$ENGINE** within a few minutes. If the game, engine or result is wrong, edit this issue and the list follows.

          보고 감사합니다! 몇 분 안에 [3D 호환 목록]($base/COMPATIBILITY.ko.md)의 **$ENGINE** 항목에 들어갑니다. 게임, 엔진, 결과가 틀렸으면 이 이슈를 수정하면 목록도 따라 바뀝니다."
