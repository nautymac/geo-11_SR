; SRWeave for geo-11 (direct_mode = sbs) - SR display weaving without ReShade
; Lives next to dxgi.dll in the game folder. Log: SRWeave.log (same folder, rewritten each run).
; Hotkeys are Ctrl+Alt + the key below (default W weave on/off, S swap eyes, L lens on/off, T test pattern).
[SRWeave]
; 1 = weave geo-11 SBS for the SR panel, 0 = show plain SBS
weave=1
; 1 if depth looks inside-out (geo-11 normally outputs left|right)
swap_eyes=0
; switch the lenticular lens to 3D while weaving
lens=1
; red left / blue right instead of the game (close right eye: red = correct)
test=0
; sRGB handling of an 8-bit back buffer: auto = follow the back buffer format (recommended),
; 1 = force sRGB views, 0 = force UNORM views. Wrong value = picture too bright (double gamma) or too dark.
srgb=auto
; eye-tracking prediction, frames
latency_frames=1
log=1
; diagnostics: log input/activation messages the game window receives
diag_input=0
; 0 = do not give the weaver the game window (it then assumes fullscreen)
weaver_hwnd=1
; hotkeys: a letter or digit (W, 5), F1-F24, NUMPAD0-9, VK_ names (VK_F6, VK_NUMPAD0), 0x hex, or none
key_weave=W
key_swap=S
key_lens=L
key_test=T
